services:
  redis:
    image: redis:8-alpine
    container_name: pointer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  postgresql:
    image: postgres:18-alpine
    container_name: pointer-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pointer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgresql-data:/var/lib/postgresql

  localstack:
    # Pinned to 4.14.0, the last release before LocalStack consolidated into a
    # single image (2026.03.0+) that requires a mandatory auth token to boot.
    # This version runs SQS fully offline with no account/token. Do not bump to
    # a 2026.x tag unless you're prepared to supply LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:4.14.0
    container_name: pointer-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      # Creates the Chargebee webhook queue + DLQ on startup (mirrors infra/sqs.tf).
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh

volumes:
  redis-data:
  postgresql-data:
  localstack-data:
