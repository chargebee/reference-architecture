<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1882 898" width="1882" height="898" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#2b2b2b"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#9aa1ab"/>
    </marker>
  </defs>

  <rect width="1882" height="898" fill="#0a0a0a"/>
  <rect width="1882" height="898" fill="url(#dots)"/>

  <!-- ============ EDGES ============ -->

  <!-- User -> Pointer App : request -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M322,424 L554,437" marker-end="url(#arrow)"/>

  <!-- Pointer App -> Chargebee API : API call -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M697,384 L697,144" marker-end="url(#arrow)"/>

  <!-- Chargebee API -> Chargebee Webhook : fan-out -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M835,95 L1069,103" marker-end="url(#arrow)"/>

  <!-- Chargebee Webhook -> SQS Queue : webhook -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M1224,170 L1224,378" marker-end="url(#arrow)"/>

  <!-- Pointer App <-> SQS Queue : enqueue -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M841,437 L1069,437" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- SQS Queue -> Webhook Worker : dequeue -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M1350,437 L1544,437" marker-end="url(#arrow)"/>

  <!-- Pointer App -> Redis : cache -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M697,497 L697,669" marker-end="url(#arrow)"/>

  <!-- Pointer App -> Postgres : persist -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M697,587 L1211,587 L1211,669" marker-end="url(#arrow)"/>

  <!-- Webhook Worker -> Postgres : persist -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M1688,497 L1688,733 L1354,733" marker-end="url(#arrow)"/>

  <!-- Webhook Worker -> Redis : cache -->
  <path stroke="#9aa1ab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M1688,733 L1688,833 L697,833 L697,796" marker-end="url(#arrow)"/>

  <!-- ============ NODES ============ -->

  <!-- Chargebee API -->
  <rect x="562" y="50" width="271" height="88" rx="16" fill="#0c0c0c" stroke="#f0a020" stroke-width="2.5"/>
  <text x="697" y="103" fill="#ffffff" font-size="26" text-anchor="middle">Chargebee API</text>

  <!-- Chargebee Webhook -->
  <rect x="1075" y="50" width="297" height="118" rx="16" fill="#0c0c0c" stroke="#f0a020" stroke-width="2.5"/>
  <text x="1223" y="102" fill="#ffffff" font-size="26" text-anchor="middle">Chargebee Webhook</text>
  <text x="1223" y="137" fill="#9aa1ab" font-size="17" text-anchor="middle">inbound</text>

  <!-- User -->
  <rect x="48" y="384" width="272" height="81" rx="16" fill="#0c0c0c" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="184" y="433" fill="#ffffff" font-size="26" text-anchor="middle">User</text>

  <!-- Pointer App -->
  <rect x="560" y="384" width="275" height="111" rx="16" fill="#0c0c0c" stroke="#6c5ce7" stroke-width="2.5"/>
  <text x="697" y="433" fill="#ffffff" font-size="26" text-anchor="middle">Pointer App</text>
  <text x="697" y="467" fill="#9aa1ab" font-size="17" text-anchor="middle">Better Auth</text>

  <!-- SQS Queue -->
  <rect x="1075" y="384" width="273" height="111" rx="16" fill="#0c0c0c" stroke="#a855f7" stroke-width="2.5"/>
  <text x="1211" y="433" fill="#ffffff" font-size="26" text-anchor="middle">SQS Queue</text>
  <text x="1211" y="467" fill="#9aa1ab" font-size="17" text-anchor="middle">webhook inbox</text>

  <!-- Webhook Worker -->
  <rect x="1550" y="384" width="276" height="111" rx="16" fill="#0c0c0c" stroke="#6366f1" stroke-width="2.5"/>
  <text x="1688" y="433" fill="#ffffff" font-size="26" text-anchor="middle">Webhook Worker</text>
  <text x="1688" y="467" fill="#9aa1ab" font-size="17" text-anchor="middle">async consumer</text>

  <!-- Redis -->
  <rect x="560" y="675" width="275" height="115" rx="16" fill="#0c0c0c" stroke="#ef4444" stroke-width="2.5"/>
  <text x="697" y="726" fill="#ffffff" font-size="26" text-anchor="middle">Redis</text>
  <text x="697" y="761" fill="#9aa1ab" font-size="17" text-anchor="middle">cache · real-time state</text>

  <!-- Postgres -->
  <rect x="1075" y="675" width="273" height="115" rx="16" fill="#0c0c0c" stroke="#22c55e" stroke-width="2.5"/>
  <text x="1211" y="726" fill="#ffffff" font-size="26" text-anchor="middle">Postgres</text>
  <text x="1211" y="761" fill="#9aa1ab" font-size="17" text-anchor="middle">system of record</text>

  <!-- ============ EDGE LABELS ============ -->

  <g>
    <rect x="392" y="415" width="96" height="34" rx="7" fill="#1b1b1b"/>
    <text x="440" y="439" fill="#e8eaed" font-size="18" text-anchor="middle">request</text>
  </g>
  <g>
    <rect x="647" y="243" width="100" height="34" rx="7" fill="#1b1b1b"/>
    <text x="697" y="267" fill="#e8eaed" font-size="18" text-anchor="middle">API call</text>
  </g>
  <g>
    <rect x="905" y="85" width="98" height="34" rx="7" fill="#1b1b1b"/>
    <text x="954" y="109" fill="#e8eaed" font-size="18" text-anchor="middle">fan-out</text>
  </g>
  <g>
    <rect x="993" y="287" width="113" height="34" rx="7" fill="#1b1b1b"/>
    <text x="1049" y="311" fill="#e8eaed" font-size="18" text-anchor="middle">webhook</text>
  </g>
  <g>
    <rect x="899" y="423" width="110" height="34" rx="7" fill="#1b1b1b"/>
    <text x="954" y="447" fill="#e8eaed" font-size="18" text-anchor="middle">enqueue</text>
  </g>
  <g>
    <rect x="1396" y="423" width="107" height="34" rx="7" fill="#1b1b1b"/>
    <text x="1449" y="447" fill="#e8eaed" font-size="18" text-anchor="middle">dequeue</text>
  </g>
  <g>
    <rect x="655" y="570" width="85" height="34" rx="7" fill="#1b1b1b"/>
    <text x="697" y="594" fill="#e8eaed" font-size="18" text-anchor="middle">cache</text>
  </g>
  <g>
    <rect x="908" y="570" width="92" height="34" rx="7" fill="#1b1b1b"/>
    <text x="954" y="594" fill="#e8eaed" font-size="18" text-anchor="middle">persist</text>
  </g>
  <g>
    <rect x="1492" y="716" width="92" height="34" rx="7" fill="#1b1b1b"/>
    <text x="1538" y="740" fill="#e8eaed" font-size="18" text-anchor="middle">persist</text>
  </g>
  <g>
    <rect x="1150" y="816" width="85" height="34" rx="7" fill="#1b1b1b"/>
    <text x="1192" y="840" fill="#e8eaed" font-size="18" text-anchor="middle">cache</text>
  </g>
</svg>
