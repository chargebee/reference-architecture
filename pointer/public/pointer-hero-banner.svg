  <text x="498" y="222" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="88" font-weight="500" fill="#1B1B2A">pointer</text>
  <text x="600" y="290" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#6B6B7B">Ask anything — get pointed straight to the answer.</text>
</svg>
